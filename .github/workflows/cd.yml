name: CD

# Runs only after CI passes on main. Builds changed components, pushes images
# tagged with the full commit SHA, then commits the new tag into k8s/.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/kavali-frontend

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        run: |
          # Compare against the previous commit on main.
          if git rev-parse --verify -q '${{ github.event.workflow_run.head_sha }}^' >/dev/null; then
            base='${{ github.event.workflow_run.head_sha }}^'
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          if git diff --name-only "$base" '${{ github.event.workflow_run.head_sha }}' | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Pin image to the built SHA
        run: |
          sha='${{ github.event.workflow_run.head_sha }}'
          sed -i -E "s|^(\s*image: ).*kavali-frontend:.*$|\1${IMAGE}:${sha}|" k8s/deployment.yaml
          git diff --quiet && exit 0
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "deploy: frontend ${sha}"
          git push
