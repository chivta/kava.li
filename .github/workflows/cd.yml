name: CD

# Runs only after CI passes on main. Builds the image, pushes it to ghcr.io
# tagged with the full commit SHA, then commits that tag into k8s/kustomization.yaml.
# Flux reconciles the manifest from this repo — nothing is applied imperatively.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      frontend_built: ${{ steps.changes.outputs.frontend }}
      tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed paths
        id: changes
        # Diff against the deployed tag recorded in kustomization.yaml.
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          BEFORE=$(grep -A2 'name: ghcr.io/chivta/kava.li/frontend' k8s/kustomization.yaml | grep -oP '(?<=newTag: )\S+' || echo "")
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "placeholder" ] || [ "$BEFORE" = "$SHA" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.frontend_built == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update tag in kustomization.yaml
        working-directory: ./k8s
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository }}/frontend=ghcr.io/${{ github.repository }}/frontend:${{ needs.build-and-push.outputs.tag }}

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: update image to ${{ needs.build-and-push.outputs.tag }}"
          git push origin HEAD:main
