apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kavali-ingress
  namespace: kavali
  annotations:
    # The websecure entrypoint's default cert covers chivtar.dev only, so this
    # router asks the letsencrypt resolver for its own kava.li certificate.
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: kava.li
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: www.kava.li
spec:
  ingressClassName: traefik
  rules:
    - host: kava.li
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.kava.li
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
